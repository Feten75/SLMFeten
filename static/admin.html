<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin - Gestion Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Panel Administration</h2>
            <button class="btn btn-danger" onclick="logout()">Déconnexion</button>
        </div>

        <div class="card shadow-sm p-4">
            <h4>Créer un nouvel utilisateur</h4>
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Username</label>
                        <input type="text" id="reg_user" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" id="reg_email" class="form-control" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Mot de passe</label>
                        <input type="password" id="reg_pass" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Rôle</label>
                        <select id="reg_role" class="form-select">
                            <option value="USER">Utilisateur (Chat)</option>
                            <option value="ADMIN">Administrateur</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Créer le compte</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
